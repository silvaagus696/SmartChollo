<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartchollo - Las Mejores Ofertas de Amazon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

    <!-- Header / Navegación -->
    <header class="bg-gradient-to-r from-orange-600 to-amber-500 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-2">
                <span class="text-3xl">🔥</span>
                <h1 class="text-2xl font-black tracking-tight">Smartchollo</h1>
            </div>
            <p class="text-orange-100 text-sm text-center md:text-right">Ofertas de Amazon.</p>
        </div>
    </header>

    <!-- Buscador Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-10 border border-slate-100">
            <h2 class="text-xl font-bold mb-4 text-slate-800 text-center">¿Qué chollo estás buscando hoy?</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Ej. Smart TV, Auriculares inalámbricos, Freidora de aire..." 
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-800"
                >
                <button 
                    onclick="buscarProductos()" 
                    class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 shadow-md">
                    Buscar Ofertas
                </button>
            </div>
        </div>

        <!-- Contenedor de Resultados -->
        <section>
            <h3 class="text-xl font-bold mb-6 text-slate-800 border-b pb-2">Chollos Destacados</h3>
            <div id="loading" class="text-center py-12 text-slate-500 hidden">Cargando chollos...</div>
            <div id="productosGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Las tarjetas de productos se inyectarán aquí -->
            </div>
        </section>
    </main>

    <!-- Configuración e Interacción con Supabase -->
    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://vfxhsmpaneoxrmabyoku.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sOl-n5qYdT3stVQJUB0PPg_WinedBPp'; // <-- Pega aquí tu clave publicable/anon

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Cargar productos al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            cargarProductos();
        });

        // Obtener productos de Supabase
        async function cargarProductos(filtro = '') {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('productosGrid');
            
            loadingEl.classList.remove('hidden');
            gridEl.innerHTML = '';

            let query = supabaseClient.from('productos').select('*').order('created_at', { ascending: false });

            if (filtro.trim() !== '') {
                query = query.ilike('titulo', `%${filtro}%`);
            }

            const { data, error } = await query;

            loadingEl.classList.add('hidden');

            if (error) {
                console.error('Error al cargar productos:', error);
                gridEl.innerHTML = `<p class="col-span-full text-red-500 text-center">Error al conectar con la base de datos.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                gridEl.innerHTML = `<p class="col-span-full text-slate-500 text-center py-8">No se encontraron chollos con ese criterio.</p>`;
                return;
            }

            // Renderizar tarjetas
            data.forEach(producto => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100 flex flex-col justify-between hover:shadow-xl transition duration-300';
                card.innerHTML = `
                    <div>
                        <img src="${producto.imagen_url || 'https://via.placeholder.com/400x250?text=Smartchollo'}" alt="${producto.titulo}" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-orange-600 bg-orange-50 px-2.5 py-1 rounded-full">${producto.categoria || 'General'}</span>
                            <h4 class="font-bold text-lg text-slate-800 mt-2 mb-2 line-clamp-2">${producto.titulo}</h4>
                            <p class="text-slate-600 text-sm line-clamp-3 mb-4">${producto.descripcion || 'Sin descripción disponible.'}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between border-t border-slate-100 mt-auto">
                        <span class="text-xs text-slate-400">Clics: <strong id="clics-${producto.id}">${producto.clics || 0}</strong></span>
                        <a href="${producto.enlace_amazon}" target="_blank" onclick="registrarClic(${producto.id})" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl text-sm transition duration-200 shadow-sm">
                            Ver Chollo en Amazon
                        </a>
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        function buscarProductos() {
            const texto = document.getElementById('searchInput').value;
            cargarProductos(texto);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarProductos();
            }
        });

        async function registrarClic(idProducto) {
            const spanClics = document.getElementById(`clics-${idProducto}`);
            if (spanClics) {
                let actual = parseInt(spanClics.innerText) || 0;
                spanClics.innerText = actual + 1;
            }

            const { data: productoActual } = await supabaseClient.from('productos').select('clics').eq('id', idProducto).single();
            if (productoActual) {
                await supabaseClient.from('productos').update({ clics: (productoActual.clics || 0) + 1 }).eq('id', idProducto);
            }
        }
    </script>
</body>
</html>
