<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartchollo - Las Mejores Ofertas e Inteligencia Artificial en Chollos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header / Navegación -->
        <header class="bg-gradient-to-r from-orange-600 to-amber-500 text-white shadow-lg">
            <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-2 cursor-pointer" onclick="filtrarCategoria('Todas')">
                    <span class="text-3xl">🔥</span>
                    <h1 class="text-2xl font-black tracking-tight">Smartchollo</h1>
                </div>
                <p class="text-orange-100 text-sm text-center md:text-right">Buscador inteligente de ofertas con IA en tiempo real.</p>
            </div>
        </header>

        <!-- Buscador Principal -->
        <main class="max-w-6xl mx-auto px-4 py-8">
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 border border-slate-100">
                <h2 class="text-xl font-bold mb-4 text-slate-800 text-center">¿Qué chollo inteligente buscas hoy?</h2>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Ej. Crema hidratante, Robot aspirador, Auriculares Bluetooth..." 
                        class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-800"
                    >
                    <button 
                        onclick="buscarOCrearChollo()" 
                        class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 shadow-md flex items-center justify-center gap-2">
                        <span>✨ Buscar con IA</span>
                    </button>
                </div>
            </div>

            <!-- Botones de Categorías Avanzadas -->
            <div class="flex flex-wrap justify-center gap-3 mb-8">
                <button onclick="filtrarCategoria('Todas')" class="cat-btn px-5 py-2.5 rounded-full font-medium text-sm transition bg-orange-600 text-white shadow-sm" data-cat="Todas">🔥 Todas</button>
                <button onclick="filtrarCategoria('Salud y belleza')" class="cat-btn px-5 py-2.5 rounded-full font-medium text-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200" data-cat="Salud y belleza">💄 Salud y Belleza</button>
                <button onclick="filtrarCategoria('Hogar')" class="cat-btn px-5 py-2.5 rounded-full font-medium text-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200" data-cat="Hogar">🏠 Hogar</button>
                <button onclick="filtrarCategoria('Tecnología')" class="cat-btn px-5 py-2.5 rounded-full font-medium text-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200" data-cat="Tecnología">💻 Tecnología</button>
            </div>

            <!-- Contenedor de Resultados -->
            <section>
                <div class="flex justify-between items-center mb-6 border-b pb-2">
                    <h3 id="categoriaTitulo" class="text-xl font-bold text-slate-800">Chollos Destacados</h3>
                    <span id="contadorResultados" class="text-sm text-slate-500 font-medium"></span>
                </div>
                <div id="loading" class="text-center py-12 text-slate-500 hidden">Buscando las mejores ofertas con IA...</div>
                <div id="productosGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Las tarjetas de productos se inyectarán aquí -->
                </div>
            </section>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm mt-12">
        <p>Smartchollo &copy; 2026 - Automatización inteligente de ofertas en Amazon.</p>
    </footer>

    <!-- Configuración e Interacción con Supabase -->
    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://vfxhsmpaneoxrmabyoku.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sOl-n5qYdT3stVQJUB0PPg_WinedBPp'; // <-- Asegúrate de mantener tu clave correcta aquí

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let categoriaActual = 'Todas';

        // Cargar productos al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            cargarProductos();
        });

        // Obtener productos de Supabase con filtros
        async function cargarProductos(filtroTexto = '', categoriaFiltro = 'Todas') {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('productosGrid');
            const contadorEl = document.getElementById('contadorResultados');
            
            loadingEl.classList.remove('hidden');
            gridEl.innerHTML = '';

            let query = supabaseClient.from('productos').select('*').order('created_at', { ascending: false });

            if (categoriaFiltro !== 'Todas') {
                query = query.eq('categoria', categoriaFiltro);
            }

            if (filtroTexto.trim() !== '') {
                query = query.ilike('titulo', `%${filtroTexto}%`);
            }

            const { data, error } = await query;

            loadingEl.classList.add('hidden');

            if (error) {
                console.error('Error al cargar productos:', error);
                gridEl.innerHTML = `<p class="col-span-full text-red-500 text-center">Error al conectar con la base de datos.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                gridEl.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                        <p class="text-slate-600 text-lg mb-2">No hemos encontrado chollos exactos para "${filtroTexto || categoriaFiltro}".</p>
                        <p class="text-slate-400 text-sm mb-6">Prueba a hacer clic en "Buscar con IA" para que el sistema busque y genere este chollo automáticamente.</p>
                    </div>`;
                contadorEl.innerText = `0 chollos`;
                return;
            }

            contadorEl.innerText = `${data.length} chollos encontrados`;

            // Renderizar tarjetas
            data.forEach(producto => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100 flex flex-col justify-between hover:shadow-xl transition duration-300';
                card.innerHTML = `
                    <div>
                        <img src="${producto.imagen_url || 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&q=80&w=600'}" alt="${producto.titulo}" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-orange-600 bg-orange-50 px-2.5 py-1 rounded-full">${producto.categoria || 'General'}</span>
                            <h4 class="font-bold text-lg text-slate-800 mt-3 mb-2 line-clamp-2">${producto.titulo}</h4>
                            <p class="text-slate-600 text-sm line-clamp-3 mb-4 leading-relaxed">${producto.descripcion || 'Sin descripción disponible.'}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between border-t border-slate-100 mt-auto bg-slate-50/50 py-3">
                        <span class="text-xs text-slate-400">Clics: <strong id="clics-${producto.id}">${producto.clics || 0}</strong></span>
                        <a href="${producto.enlace_amazon || 'https://amazon.es'}" target="_blank" onclick="registrarClic(${producto.id})" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl text-sm transition duration-200 shadow-sm">
                            Ver Chollo &rarr;
                        </a>
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        function filtrarCategoria(categoria) {
            categoriaActual = categoria;
            document.getElementById('categoriaTitulo').innerText = categoria === 'Todas' ? 'Chollos Destacados' : `Chollos en ${categoria}`;
            
            // Actualizar diseño de botones
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === categoria) {
                    btn.className = 'cat-btn px-5 py-2.5 rounded-full font-medium text-sm transition bg-orange-600 text-white shadow-sm';
                } else {
                    btn.className = 'cat-btn px-5 py-2.5 rounded-full font-medium text-sm transition bg-white text-slate-700 hover:bg-slate-100 border border-slate-200';
                }
            });

            const textoBusqueda = document.getElementById('searchInput').value;
            cargarProductos(textoBusqueda, categoriaActual);
        }

        async function buscarOCrearChollo() {
            const texto = document.getElementById('searchInput').value.trim();
            if (!texto) {
                cargarProductos('', categoriaActual);
                return;
            }

            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('productosGrid');
            loadingEl.classList.remove('hidden');
            gridEl.innerHTML = '';

            // Primero buscamos en la base de datos
            let query = supabaseClient.from('productos').select('*').ilike('titulo', `%${texto}%`);
            if (categoriaActual !== 'Todas') {
                query = query.eq('categoria', categoriaActual);
            }
            let { data } = await query;

            if (data && data.length > 0) {
                loadingEl.classList.add('hidden');
                cargarProductos(texto, categoriaActual);
                return;
            }

            // Si no existe, simulamos la respuesta inteligente de la IA y lo guardamos automáticamente en Supabase
            setTimeout(async () => {
                let categoriaAsignada = categoriaActual === 'Todas' ? 'Tecnología' : categoriaActual;
                if (texto.toLowerCase().includes('crema') || texto.toLowerCase().includes('cabello') || texto.toLowerCase().includes('belleza') || texto.toLowerCase().includes('salud')) {
                    categoriaAsignada = 'Salud y belleza';
                } else if (texto.toLowerCase().includes('hogar') || texto.toLowerCase().includes('aspirador') || texto.toLowerCase().includes('cocina') || texto.toLowerCase().includes('lámpara')) {
                    categoriaAsignada = 'Hogar';
                }

                const nuevoProducto = {
                    titulo: `Oferta Destacada en ${texto}`,
                    descripcion: `Este producto ha sido seleccionado inteligentemente por alta demanda. Destaca por su fantástica relación calidad-precio, valoraciones excelentes de usuarios y rendimiento superior en ${categoriaAsignada.toLowerCase()}. ¡Una oportunidad única de compra en Amazon!`,
                    enlace_amazon: `https://www.amazon.es/s?k=${encodeURIComponent(texto)}`,
                    imagen_url: 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&q=80&w=600',
                    categoria: categoriaAsignada,
                    clics: 0
                };

                // Guardar automáticamente en Supabase
                await supabaseClient.from('productos').insert([nuevoProducto]);

                // Recargar listado
                cargarProductos(texto, categoriaActual);
            }, 1000);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarOCrearChollo();
            }
        });

        async function registrarClic(idProducto) {
            const spanClics = document.getElementById(`clics-${idProducto}`);
            if (spanClics) {
                let actual = parseInt(spanClics.innerText) || 0;
                spanClics.innerText = actual + 1;
            }

            const { data: productoActual } = await supabaseClient.from('productos').select('clics').eq('id', idProducto).single();
            if (productoActual) {
                await supabaseClient.from('productos').update({ clics: (productoActual.clics || 0) + 1 }).eq('id', idProducto);
            }
        }
    </script>
</body>
</html>
